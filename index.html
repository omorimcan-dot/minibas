<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>師岡ミニバス スコア分析</title>
<style>
:root{--bg:#0A0E17;--card:#1a2235;--border:#2a3a52;--green:#34D399;--red:#F87171;--gold:#FBBF24;--blue:#38BDF8;--text:#F1F5F9;--muted:#64748B;--sub:#94A3B8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Noto Sans JP',sans-serif;min-height:100vh;}
.wrap{max-width:900px;margin:0 auto;padding:18px 13px 40px;}
.header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.hbar{width:4px;height:34px;background:var(--green);border-radius:2px;}
.header h1{font-size:17px;font-weight:900;}
.header p{color:var(--muted);font-size:11px;margin-top:2px;}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;}
.fbtn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 13px;cursor:pointer;font-size:12px;font-family:inherit;}
.fbtn.on{background:rgba(56,189,248,.15);border-color:var(--blue);color:var(--blue);font-weight:700;}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tbtn{background:none;border:none;cursor:pointer;padding:8px 13px;color:var(--muted);font-size:12px;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tbtn.on{color:var(--text);font-weight:700;border-bottom-color:var(--blue);}
.panel{display:none;}.panel.on{display:block;}
.krow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;flex:1;min-width:85px;}
.klbl{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.kval{font-size:24px;font-weight:800;line-height:1.1;}
.ksub{color:var(--muted);font-size:11px;margin-top:3px;}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
@media(max-width:500px){.charts{grid-template-columns:1fr;}}
.cbox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.ctitle{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
.barwrap{display:flex;gap:14px;align-items:flex-end;height:100px;}
.bgrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bars{display:flex;gap:3px;align-items:flex-end;height:74px;}
.bar{border-radius:3px 3px 0 0;min-height:2px;}
.leg{display:flex;gap:12px;margin-top:8px;}
.legitem{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;}
.legdot{width:8px;height:8px;border-radius:2px;}
.trendwrap{display:flex;gap:4px;align-items:flex-end;height:100px;}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.qdtl{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.qcols{display:flex;}
.qcol{flex:1;padding:8px 0;border-right:1px solid var(--border);text-align:center;}
.qcol:last-child{border-right:none;}
.glist{display:flex;flex-direction:column;gap:7px;}
.gcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 13px;border-left-width:3px;border-left-style:solid;cursor:pointer;}
.gcard-detail{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
.gcard-detail.open{display:block;}
.gcard-detail table{font-size:11px;}
.gcard-detail th{color:var(--muted);padding:4px 6px;font-weight:500;border-bottom:1px solid var(--border);text-align:right;}
.gcard-detail th:nth-child(2){text-align:left;}
.gcard-detail td{padding:5px 6px;text-align:right;border-bottom:1px solid rgba(42,58,82,.3);}
.gcard-detail td:nth-child(2){text-align:left;}
.gcard-detail tr:last-child td{border-bottom:none;}
.expand-icon{color:var(--muted);font-size:12px;margin-left:6px;}
.pill{border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;border-width:1px;border-style:solid;display:inline-block;}
.pbox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{color:var(--muted);padding:5px 6px;font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right;}
th:nth-child(2){text-align:left;}
td{padding:7px 6px;border-bottom:1px solid rgba(42,58,82,.4);white-space:nowrap;text-align:right;}
td:nth-child(2){text-align:left;font-weight:600;}
tr:last-child td{border-bottom:none;}
tr:nth-child(even){background:rgba(17,24,39,.4);}
.note{color:var(--muted);font-size:10px;margin-top:8px;}
.qbar-row{display:flex;gap:3px;margin-top:2px;}
.qbar{height:6px;border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="hbar"></div>
    <div><h1>師岡ミニバスケットボールクラブ</h1><p id="game-count">2025-26シーズン　スコア分析</p></div>
  </div>
  <div class="filters">
    <button class="fbtn on" onclick="setFilter('all',this)">全試合</button>
    <button class="fbtn" onclick="setFilter('league',this)">リーグ戦</button>
    <button class="fbtn" onclick="setFilter('official',this)">公式戦</button>
    <button class="fbtn" onclick="setFilter('practice',this)">練習試合</button>
  </div>
  <div class="tabs">
    <button class="tbtn on" onclick="setTab('dash',this)">ダッシュボード</button>
    <button class="tbtn" onclick="setTab('games',this)">試合一覧</button>
    <button class="tbtn" onclick="setTab('scoring',this)">得点分析</button>
    <button class="tbtn" onclick="setTab('fouls',this)">ファール分析</button>
    <button class="tbtn" onclick="setTab('qana',this)">Q別分析</button>
  </div>

  <div id="panel-dash" class="panel on">
    <div class="krow" id="krow"></div>
    <div class="charts">
      <div class="cbox">
        <div class="ctitle">クォーター別 平均得点</div>
        <div class="barwrap" id="qchart"></div>
        <div class="leg">
          <div class="legitem"><div class="legdot" style="background:var(--green)"></div>自チーム</div>
          <div class="legitem"><div class="legdot" style="background:var(--muted);opacity:.5"></div>相手</div>
        </div>
      </div>
      <div class="cbox">
        <div class="ctitle">試合別スコア推移</div>
        <div class="trendwrap" id="trend"></div>
      </div>
    </div>
    <div class="qdtl">
      <div class="ctitle">クォーター別 合計・得失点差</div>
      <div class="qcols" id="qdtl"></div>
    </div>
  </div>

  <div id="panel-games" class="panel">
    <div class="glist" id="glist"></div>
  </div>

  <!-- 得点分析 -->
  <div id="panel-scoring" class="panel">
    <div class="pbox">
      <div class="ctitle" id="score-title">得点分析（総得点順）</div>
      <table>
        <thead><tr><th>#</th><th>選手名</th><th>出場</th><th>総得点</th><th>平均得点</th><th>Q1得点率</th><th>Q2得点率</th><th>Q3得点率</th><th>Q4得点率</th></tr></thead>
        <tbody id="score-tbody"></tbody>
      </table>
      <div class="note">※ Q別得点率 = そのQの出場試合での平均得点（出場Qのみ集計）</div>
    </div>
  </div>

  <!-- ファール分析 -->
  <div id="panel-fouls" class="panel">
    <div class="pbox">
      <div class="ctitle" id="foul-title">ファール分析（ファール率高い順）</div>
      <table>
        <thead><tr><th>#</th><th>選手名</th><th>出場</th><th>総ファール</th><th>平均F/試合</th><th>F率</th><th>判定</th></tr></thead>
        <tbody id="foul-tbody"></tbody>
      </table>
      <div class="note">※ F率 = 総ファール ÷ 総出場Q数</div>
    </div>
  </div>

  <div id="panel-qana" class="panel">
    <div class="pbox">
      <div class="ctitle">Q別 出場率</div>
      <table>
        <thead><tr><th>#</th><th>選手名</th><th>Q1出場率</th><th>Q2出場率</th><th>Q3出場率</th><th>Q4出場率</th></tr></thead>
        <tbody id="qapp"></tbody>
      </table>
    </div>
    <div class="pbox">
      <div class="ctitle">チーム Q別 得失点詳細</div>
      <table>
        <thead><tr><th>G</th><th>対戦相手</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>合計</th><th>結果</th></tr></thead>
        <tbody id="qscore"></tbody>
      </table>
    </div>
  </div>
</div>

const S=a=>a.reduce((x,y)=>x+y,0);
const AVG=a=>a.length?S(a)/a.length:0;
const PCT=(n,d)=>d?Math.round(n/d*100):0;
const F1=n=>Number(n).toFixed(1);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let curFilter='all';

function getFiltered(){
  if(curFilter==='league') return GAMES.filter(g=>g.tournament==='リーグ戦');
  if(curFilter==='official') return GAMES.filter(g=>g.tournament!=='練習試合');
  if(curFilter==='practice') return GAMES.filter(g=>g.tournament==='練習試合');
  return GAMES;
}

function buildPlayers(games){
  const m={};
  games.forEach(g=>{
    g.players.forEach(p=>{
      if(!m[p.name]) m[p.name]={name:p.name,no:p.no,gp:0,totalQ:0,totalF:0,totalPts:0,q1:0,q2:0,q3:0,q4:0};
      if(p.q.length>0) m[p.name].gp++;
      m[p.name].totalQ+=p.q.length;
      m[p.name].totalF+=p.f;
      m[p.name].totalPts+=p.pts;
      if(p.q.includes(1))m[p.name].q1++;
      if(p.q.includes(2))m[p.name].q2++;
      if(p.q.includes(3))m[p.name].q3++;
      if(p.q.includes(4))m[p.name].q4++;
    });
  });
  return Object.values(m).map(p=>({
    ...p,
    rate:PCT(p.gp,games.length),
    avgQ:p.gp?p.totalQ/p.gp:0,
    avgF:p.gp?p.totalF/p.gp:0,
    avgPts:p.gp?p.totalPts/p.gp:0,
    q1r:PCT(p.q1,games.length),
    q2r:PCT(p.q2,games.length),
    q3r:PCT(p.q3,games.length),
    q4r:PCT(p.q4,games.length),
  })).sort((a,b)=>b.totalPts-a.totalPts||a.no-b.no);
}

function rc(r){return r>=90?'var(--gold)':r>=70?'var(--green)':r>=40?'var(--sub)':'var(--red)';}

function render(){

  const games=getFiltered();

  const oppT=games.map(g=>S(g.opp));
  const wins=games.filter((_,i)=>ourT[i]>oppT[i]).length;
  const diff=AVG(ourT)-AVG(oppT);
  const players=buildPlayers(games);
  const totalPts=S(players.map(p=>p.totalPts));

  // KPI
  const wc=wins>=games.length-wins?'var(--green)':'var(--red)';
  document.getElementById('krow').innerHTML=`

    <div class="kpi"><div class="klbl">平均得点</div><div class="kval">${F1(AVG(ourT))}</div><div class="ksub">平均失点 ${F1(AVG(oppT))}</div></div>
    <div class="kpi"><div class="klbl">得失点差</div><div class="kval" style="color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'+':''}${F1(diff)}</div><div class="ksub">1試合平均</div></div>
    <div class="kpi"><div class="klbl">最高/最低</div><div class="kval">${Math.max(...ourT)}</div><div class="ksub">最低 ${Math.min(...ourT)}</div></div>

  `;

  // Qチャート
  const qAvg=[0,1,2,3].map(q=>({q:q+1,our:AVG(games.map(g=>g.our[q])),opp:AVG(games.map(g=>g.opp[q]))}));
  const maxQ=Math.max(...qAvg.flatMap(q=>[q.our,q.opp]),1);
  document.getElementById('qchart').innerHTML=qAvg.map(q=>`

    </div>`;
  }).join('');

  // Q合計
  document.getElementById('qdtl').innerHTML=[0,1,2,3].map(q=>{
    const os=S(games.map(g=>g.our[q]));

  // 試合一覧
  document.getElementById('glist').innerHTML=[...games].sort((a,b)=>a.date.localeCompare(b.date)).map((g,gi)=>{

  // Q別得点率計算（出場したQごとの平均得点）
  function qPtsRate(playerName, qNum, games){
    let totalPts=0, count=0;
    games.forEach(g=>{
      const p=g.players.find(x=>x.name===playerName);
      if(p && p.q.includes(qNum)){
        // そのQの得点を按分（出場Q数で割る）
        const pts = p.q.length>0 ? p.pts/p.q.length : 0;
        totalPts+=pts; count++;
      }
    });
    return count>0?totalPts/count:0;
  }

      <td style="color:var(--muted)">${p.no}</td>
      <td>${esc(p.name)}</td>
      <td style="color:${rc(p.rate)}">${p.gp}/${games.length}</td>
      <td style="color:${pc};font-weight:700;font-size:13px">${p.totalPts}</td>
      <td style="color:${pc}">${F1(p.avgPts)}</td>
      ${qcell(q1r)}${qcell(q2r)}${qcell(q3r)}${qcell(q4r)}
    </tr>`;
  }).join('');

  // ファール分析（F率高い順）
  const foulPlayers=[...players].filter(p=>p.gp>0).sort((a,b)=>b.avgF-a.avgF);
  document.getElementById('foul-title').textContent=`ファール分析（${games.length}試合・F率高い順）`;
  document.getElementById('foul-tbody').innerHTML=foulPlayers.map(p=>{
    const totalQ=games.reduce((s,g)=>{const pl=g.players.find(x=>x.name===p.name);return s+(pl?pl.q.length:0);},0);
    const fRate=totalQ>0?p.totalF/totalQ:0;
    const fc=fRate>=0.5?'var(--red)':fRate>=0.3?'var(--gold)':'var(--green)';
    const label=fRate>=0.5?'⚠️ 要注意':fRate>=0.3?'△ 観察中':'○ 良好';
    return `<tr>
      <td style="color:var(--muted)">${p.no}</td>
      <td>${esc(p.name)}</td>
      <td>${p.gp}/${games.length}</td>
      <td style="color:${fc};font-weight:700">${p.totalF}</td>
      <td style="color:${fc}">${F1(p.avgF)}</td>
      <td style="color:${fc};font-weight:700">${(fRate*100).toFixed(0)}%</td>
      <td style="color:${fc};font-size:11px">${label}</td>
    </tr>`;
  }).join('');

  // Q別出場率
  document.getElementById('qapp').innerHTML=players.map(p=>`<tr>
    <td style="color:var(--muted)">${p.no}</td>
    <td>${esc(p.name)}</td>
    <td style="color:${rc(p.q1r)};font-weight:700">${p.q1r}%</td>
    <td style="color:${rc(p.q2r)};font-weight:700">${p.q2r}%</td>
    <td style="color:${rc(p.q3r)};font-weight:700">${p.q3r}%</td>
    <td style="color:${rc(p.q4r)};font-weight:700">${p.q4r}%</td>
  </tr>`).join('');

  // Q別チームスコア
  document.getElementById('qscore').innerHTML=games.map((g,i)=>{
    const us=ourT[i],them=oppT[i],win=us>them;
    const col=win?'var(--green)':'var(--red)';
    return `<tr>
      <td style="color:var(--muted)">G${i+1}</td>
      <td style="text-align:left;font-size:11px">${esc(g.opponent)}</td>
      ${g.our.map((q,qi)=>{const d=q-g.opp[qi];return `<td style="color:${d>0?'var(--green)':d<0?'var(--red)':'var(--sub)'}">${q}<span style="color:var(--muted);font-size:9px">(${d>=0?'+':''}${d})</span></td>`;}).join('')}
      <td style="color:${col};font-weight:700">${us}-${them}</td>
      <td><span class="pill" style="color:${col};background:${col}20;border-color:${col}40">${win?'勝':'負'}</span></td>
    </tr>`;
  }).join('');

}

function toggleDetail(card){
  const detail=card.querySelector('.gcard-detail');
  const icon=card.querySelector('.expand-icon');
  detail.classList.toggle('open');
  icon.textContent=detail.classList.contains('open')?'▲':'▼';
}
function setFilter(v,btn){
  curFilter=v;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function setTab(v,btn){
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('panel-'+v).classList.add('on');
}
render();
</script>
</body>
</html>
